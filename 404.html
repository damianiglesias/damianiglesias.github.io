<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="dark light">
<title>404 — Page not found · Damian Iglesias</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
  :root{--bg:#0a0a0a;--ink:#f4f4f5;--muted:#8b8b92;--line:#3a3a3a}
  @media (prefers-color-scheme:light){:root{--bg:#fafafa;--ink:#0a0a0a;--muted:#6b6b73;--line:#d4d4d8}}
  *{box-sizing:border-box;margin:0}
  body{min-height:100svh;display:grid;place-items:center;padding:24px;background:var(--bg);color:var(--ink);font:400 17px/1.6 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  main{max-width:520px}
  h1{font-size:clamp(72px,18vw,160px);font-weight:700;letter-spacing:-.04em;line-height:1}
  p{margin:16px 0 28px;color:var(--muted)}
  a{display:inline-block;padding:12px 24px;border-radius:999px;border:1px solid var(--line);color:var(--ink);text-decoration:none;font-weight:500;transition:background .25s,color .25s}
  a:hover,a:focus-visible{background:var(--ink);color:var(--bg)}
</style>
</head>
<body>
<main>
  <h1>404</h1>
  <p>This page doesn't exist. / Esta página no existe.</p>
  <a href="/">damianiglesias.github.io</a>
</main>
</body>
</html>
